[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmesh-sdk"
version = "0.1.0"
description = "Python client for the AgentMesh AI control plane"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0"]

[tool.setuptools.packages.find]
include = ["agentmesh*"]
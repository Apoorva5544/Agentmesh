[project]
name = "llm-gateway"
version = "0.1.0"
description = "FastAPI LLM gateway with semantic caching, prompt compression, routing, and usage tracking."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.34.0",
  "asyncpg>=0.29.0",
  "fastapi>=0.112.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "jsonschema>=4.21.0",
  "numpy>=2.0.0",
  "openai>=1.40.0",
  "opentelemetry-api>=1.24.0",
  "opentelemetry-exporter-otlp-proto-http>=1.24.0",
  "opentelemetry-instrumentation-asyncpg>=0.48b0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-sdk>=1.24.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.8",
  "tiktoken>=0.7.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = [
  "app/main.py",
  "app/routers/*",
  "app/db.py",
  "app/adapters/*",
  "app/telemetry.py",
  "app/metrics.py"
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "pragma: no cover"
]
show_missing = true

